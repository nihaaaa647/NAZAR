services:
  - type: web
    name: nazar-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      # Ships the ~63 MB trimmed snapshot committed at deploy_data/ (see
      # scripts/prepare_deploy_data.py) instead of the 5.6 GB local pipeline
      # output — Render's free plan has no persistent disk to hold that anyway.
      - key: NAZAR_DATA_DIR
        value: deploy_data
      # Reviewer decisions (Confirm/Dismiss). Render's free plan has no
      # persistent disk, so a local SQLite file would reset every cold start —
      # set this to a Postgres connection string (e.g. a free Neon project) so
      # decisions actually survive. sync: false means Render prompts for the
      # value during setup and never stores it in this file / git. Leave unset
      # to fall back to SQLite at NAZAR_DB_PATH (fine for local dev, not for a
      # demo you'll revisit — see README's Deploy section).
      - key: NAZAR_DATABASE_URL
        sync: false
      - key: NAZAR_AUTH_SECRET
        generateValue: true
      # Tighten to the exact Vercel URL once you have it, e.g.
      # https://nazar-review.vercel.app — a comma-separated list is accepted.
      - key: NAZAR_CORS_ORIGINS
        value: "*"
